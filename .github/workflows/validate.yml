name: Validate Agent Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate portable package
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const portableSkills = [
            'brief-product-work',
            'import-product-evidence',
            'manage-product-study',
            'set-up-product-workspace',
          ];
          const openAiSkills = [
            'brief-product-work',
            'import-product-evidence',
            'set-up-product-workspace',
          ];
          const fail = (message) => {
            console.error(`FAIL ${message}`);
            process.exitCode = 1;
          };
          const pass = (message) => console.log(`PASS ${message}`);
          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));

          const manifest = readJson('plugin.json');
          if (manifest.$schema !== 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json') fail('plugin schema');
          if (manifest.name !== 'zentrik') fail('plugin name');
          if (manifest.version !== '1.4.0') fail('plugin version');
          if (Object.keys(manifest).some((key) => !['$schema', 'name', 'version', 'description', 'author', 'homepage', 'repository', 'license', 'keywords', 'extensions'].includes(key))) fail('plugin fields');
          if (!manifest.extensions?.['com.openai'] || typeof manifest.extensions['com.openai'] !== 'object') fail('OpenAI extension namespace');
          pass('plugin manifest');

          const marketplace = readJson('.agents/plugins/marketplace.json');
          const marketplaceEntry = marketplace.plugins?.find((plugin) => plugin.name === 'zentrik');
          if (marketplace.name !== 'zentrik-agent-plugins') fail('Codex marketplace name');
          if (marketplaceEntry?.source?.source !== 'local' || marketplaceEntry?.source?.path !== './com.openai/zentrik') fail('Codex marketplace package path');
          if (marketplaceEntry?.policy?.installation !== 'AVAILABLE' || marketplaceEntry?.policy?.authentication !== 'ON_INSTALL') fail('Codex marketplace policies');
          pass('Codex marketplace catalog');

          const mcp = readJson('mcp.json');
          const server = mcp.mcpServers?.zentrik;
          if (mcp.$schema !== 'https://agent-plugins.org/schemas/1.0.0/mcp.schema.json') fail('MCP schema');
          if (server?.type !== 'streamable-http' || server?.url !== 'https://zentrik.ai/mcp') fail('MCP server');
          if (JSON.stringify(mcp).match(/token|password|secret|api[_-]?key|authorization/i)) fail('MCP credential material');
          pass('MCP configuration');

          const validateSkills = (root, label, expectedSkills) => {
            const actualSkills = fs.readdirSync(root, { withFileTypes: true }).filter((entry) => entry.isDirectory()).map((entry) => entry.name).sort();
            if (JSON.stringify(actualSkills) !== JSON.stringify([...expectedSkills].sort())) fail(`${label} skill set`);
            for (const skill of expectedSkills) {
              const file = path.join(root, skill, 'SKILL.md');
              const content = fs.readFileSync(file, 'utf8');
              if (!content.match(new RegExp(`^---\\nname: ${skill}\\n`))) fail(`${label} ${skill} frontmatter name`);
              if (!content.match(/^description: .+$/m)) fail(`${label} ${skill} description`);
              if (content.match(/\bClaude\b|mcp__plugin_|mcp__zentrik__/i)) fail(`${label} ${skill} client neutrality`);
            }
          };
          validateSkills('skills', 'portable', portableSkills);

          const openAiRoot = 'com.openai/zentrik';
          const openAiManifest = readJson(path.join(openAiRoot, '.codex-plugin/plugin.json'));
          if (openAiManifest.name !== 'zentrik' || openAiManifest.version !== '1.3.0') fail('OpenAI plugin identity');
          if (openAiManifest.skills !== './skills/' || openAiManifest.apps !== './.app.json') fail('OpenAI plugin resources');
          if (!['Interactive', 'Read', 'Write'].every((capability) => openAiManifest.interface?.capabilities?.includes(capability))) fail('OpenAI capabilities');
          if (openAiManifest.interface?.defaultPrompt?.length !== 3) fail('OpenAI starter prompts');

          const appMapping = readJson(path.join(openAiRoot, '.app.json'));
          const app = appMapping.apps?.zentrik;
          if (Object.keys(appMapping.apps || {}).length !== 1) fail('OpenAI app count');
          if (app?.id !== 'asdk_app_6a51ef5c6e648191b549bff1c57bfdd6' || Object.keys(app).length !== 1) fail('OpenAI app mapping');
          validateSkills(path.join(openAiRoot, 'skills'), 'OpenAI', openAiSkills);

          for (const file of ['assets/icon.png', 'assets/logo.png']) {
            const data = fs.readFileSync(path.join(openAiRoot, file));
            const width = data.readUInt32BE(16);
            const height = data.readUInt32BE(20);
            if (width !== height || width < 48 || width > 4096) fail(`${file} dimensions`);
          }
          pass('portable and OpenAI packages');
          if (!fs.existsSync('LICENSE') || !fs.existsSync('NOTICE')) fail('legal files');
          pass('legal files');
          if (process.exitCode) process.exit(1);
          NODE
